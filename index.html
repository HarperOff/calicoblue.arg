<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/// ARCHIVO_DESCONOCIDO ///</title>
    <!-- Fuente Pixelada de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* Estilos Góticos con detalles Azul Neón */
        body {
            background-color: #050508;
            color: #d1e8ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            position: relative;
            text-align: center;
            background: #0a0d14;
            padding: 40px;
            border: 1px solid #1e3a8a;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(30, 144, 255, 0.25), inset 0 0 15px rgba(0, 102, 255, 0.1);
            max-width: 450px;
            width: 90%;
        }

        h1 {
            color: #3b82f6;
            font-size: 1.4rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
            margin-bottom: 25px;
        }

        p {
            font-size: 1.1rem;
            color: #93c5fd;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        input[type="text"] {
            background-color: #030712;
            border: 1px solid #2563eb;
            color: #60a5fa;
            padding: 12px 15px;
            font-family: inherit;
            font-size: 1rem;
            text-align: center;
            width: 80%;
            border-radius: 4px;
            outline: none;
            box-shadow: inset 0 0 5px rgba(37, 99, 235, 0.5);
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 12px rgba(96, 165, 250, 0.8);
        }

        /* Input de tipo archivo personalizado */
        .file-upload-wrapper {
            margin-bottom: 15px;
        }

        input[type="file"] {
            display: none;
        }

        .file-custom-btn {
            display: inline-block;
            background-color: #0f172a;
            border: 1px dashed #3b82f6;
            color: #93c5fd;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .file-custom-btn:hover {
            border-color: #60a5fa;
            background-color: #1e293b;
        }

        button {
            margin-top: 15px;
            background-color: #1e40af;
            color: #ffffff;
            border: none;
            padding: 10px 25px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(30, 64, 175, 0.5);
            transition: background-color 0.3s, transform 0.1s;
        }

        button:hover {
            background-color: #2563eb;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.8);
        }

        .response-msg {
            margin-top: 20px;
            font-size: 0.95rem;
            min-height: 24px;
        }

        .success { color: #60a5fa; }
        .error { color: #f87171; }

        /* Pista secreta/oculta */
        .secret-hint {
            position: absolute;
            bottom: 8px;
            right: 12px;
            font-size: 0.65rem;
            color: rgba(147, 197, 253, 0.08);
            user-select: none;
            pointer-events: none;
        }

        /* Estilo para la pantalla secreta de Sans */
        #sansContainer {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }

        #sansContainer img {
            max-width: 220px;
            height: auto;
            image-rendering: pixelated;
        }

        .sans-text {
            margin-top: 25px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.9rem;
            color: #ffffff;
            text-align: center;
            letter-spacing: 1px;
            animation: floatText 2s ease-in-out infinite;
        }

        @keyframes floatText {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
    </style>
</head>
<body>

<!-- Pantalla de Sans (Sombra Secreta) -->
<div id="sansContainer">
    <img src="sans.png" alt="sans">
    <div class="sans-text">¿Que estás buscando?</div>
</div>

<!-- Contenedor Principal del Juego -->
<div class="container" id="mainContainer">
    <h1>[ PROYECTO: CÁLICO_AZUL ]</h1>

    <!-- FORMULARIO FASE 1 Y FASE 2 (Códigos) -->
    <form id="codeForm">
        <p id="promptText"># Ingresa el código</p>
        <input type="text" id="userInput" placeholder="Escribe tu respuesta..." autocomplete="off">
        <br>
        <button type="submit">INGRESAR</button>
    </form>

    <!-- FORMULARIO FASE 3 (Subida de Foto) -->
    <form id="photoForm" action="https://formspree.io/f/xppwdwaw" method="POST" enctype="multipart/form-data" style="display: none;">
        <p>Envíame una foto del primer dibujo que te di</p>
        
        <!-- Campos invisibles para registrar datos del visitante -->
        <input type="hidden" id="userAgent" name="dispositivo_navegador" value="">
        <input type="hidden" id="fechaHora" name="fecha_y_hora" value="">
        <input type="hidden" name="fase" value="Foto del primer dibujo subida con exito">

        <div class="file-upload-wrapper">
            <label for="photoInput" class="file-custom-btn" id="fileLabel">📸 Seleccionar archivo...</label>
            <input type="file" id="photoInput" name="foto" accept="image/*" required>
        </div>

        <button type="submit">ENVIAR FOTO</button>
    </form>

    <div id="responseMsg" class="response-msg"></div>

    <!-- Pista casi invisible -->
    <div class="secret-hint">¿has pensado en recargar la pagina?</div>
</div>

<script>
    // Registro automático de datos del visitante
    document.getElementById('userAgent').value = navigator.userAgent;
    document.getElementById('fechaHora').value = new Date().toLocaleString();

    // Contador de recargas (Easter Egg de Sans a las 5 recargas)
    let reloadCount = parseInt(localStorage.getItem('arg_reload_count') || '0', 10);
    reloadCount += 1;

    if (reloadCount === 5) {
        document.getElementById('mainContainer').style.display = 'none';
        document.getElementById('sansContainer').style.display = 'flex';
        localStorage.setItem('arg_reload_count', reloadCount);
    } else if (reloadCount >= 6) {
        localStorage.setItem('arg_reload_count', '0');
    } else {
        localStorage.setItem('arg_reload_count', reloadCount);
    }

    // Elementos DOM
    const codeForm = document.getElementById('codeForm');
    const photoForm = document.getElementById('photoForm');
    const input = document.getElementById('userInput');
    const photoInput = document.getElementById('photoInput');
    const fileLabel = document.getElementById('fileLabel');
    const msg = document.getElementById('responseMsg');
    const promptText = document.getElementById('promptText');

    // Estado del juego
    let stage = 1; // 1: Esperando "alfa", 2: Esperando "porcelana"

    // Cambiar texto de botón de archivo cuando selecciona imagen
    photoInput.addEventListener('change', function() {
        if (this.files && this.files[0]) {
            fileLabel.textContent = '📁 ' + this.files[0].name;
        } else {
            fileLabel.textContent = '📸 Seleccionar archivo...';
        }
    });

    // Lógica del Formulario de Códigos (Fase 1 y 2)
    codeForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const value = input.value.trim().toLowerCase();

        if (stage === 1) {
            if (value === 'alfa') {
                stage = 2;
                promptText.textContent = '¿Quién era nuestro dolor de cabeza?';
                input.value = '';
                msg.textContent = '';
            } else if (value === 'porcelana') {
                // Atajo directo ingresando "porcelana"
                irAFase3();
            } else {
                msg.className = 'response-msg error';
                msg.textContent = 'Codigo equivocado, Alfa ;p';
            }
        } else if (stage === 2) {
            if (value === 'porcelana') {
                irAFase3();
            } else {
                msg.className = 'response-msg error';
                msg.textContent = 'Codigo equivocado, Alfa ;p';
            }
        }
    });

    function irAFase3() {
        codeForm.style.display = 'none';
        photoForm.style.display = 'block';
        msg.textContent = '';
    }

    // Lógica de Envío de la Foto a Formspree (Fase 3)
    photoForm.addEventListener('submit', function(e) {
        e.preventDefault();
        msg.className = 'response-msg success';
        msg.textContent = 'Subiendo imagen...';

        const formData = new FormData(photoForm);

        fetch(photoForm.action, {
            method: 'POST',
            body: formData,
            headers: { 'Accept': 'application/json' }
        })
        .then(response => {
            if (response.ok) {
                photoForm.style.display = 'none';
                msg.className = 'response-msg success';
                msg.style.fontSize = '1.1rem';
                msg.style.marginTop = '0';
                msg.textContent = 'Imagen recibida. Espera un tiempo y vuelve cuando resuelvas la proxima pregunta (#)';
            } else {
                msg.className = 'response-msg error';
                msg.textContent = 'Error al subir la imagen. Inténtalo de nuevo.';
            }
        })
        .catch(() => {
            msg.className = 'response-msg error';
            msg.textContent = 'Error de conexión. Inténtalo de nuevo.';
        });
    });
</script>

</body>
</html>
