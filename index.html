<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/// ARCHIVO_DESCONOCIDO ///</title>
    <!-- Fuente Pixelada de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* Estilos Góticos con detalles Azul Neón */
        body {
            background-color: #050508;
            color: #d1e8ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            position: relative;
            text-align: center;
            background: #0a0d14;
            padding: 40px;
            border: 1px solid #1e3a8a;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(30, 144, 255, 0.25), inset 0 0 15px rgba(0, 102, 255, 0.1);
            max-width: 450px;
            width: 90%;
        }

        h1 {
            color: #3b82f6;
            font-size: 1.4rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
            margin-bottom: 25px;
        }

        p {
            font-size: 1.1rem;
            color: #93c5fd;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        input[type="text"] {
            background-color: #030712;
            border: 1px solid #2563eb;
            color: #60a5fa;
            padding: 12px 15px;
            font-family: inherit;
            font-size: 1rem;
            text-align: center;
            width: 80%;
            border-radius: 4px;
            outline: none;
            box-shadow: inset 0 0 5px rgba(37, 99, 235, 0.5);
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 12px rgba(96, 165, 250, 0.8);
        }

        button {
            margin-top: 15px;
            background-color: #1e40af;
            color: #ffffff;
            border: none;
            padding: 10px 25px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(30, 64, 175, 0.5);
            transition: background-color 0.3s, transform 0.1s;
        }

        button:hover {
            background-color: #2563eb;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.8);
        }

        .response-msg {
            margin-top: 20px;
            font-size: 0.95rem;
            min-height: 24px;
        }

        .error { color: #f87171; }

        /* Mensaje final al completar las preguntas */
        .discord-instruction {
            color: #60a5fa;
            font-size: 1.1rem;
            line-height: 1.6;
            text-shadow: 0 0 8px rgba(96, 165, 250, 0.5);
        }

        /* Pista secreta/oculta */
        .secret-hint {
            position: absolute;
            bottom: 8px;
            right: 12px;
            font-size: 0.65rem;
            color: rgba(147, 197, 253, 0.08);
            user-select: none;
            pointer-events: none;
        }

        /* Estilo para la pantalla secreta de Sans */
        #sansContainer {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }

        #sansContainer img {
            max-width: 220px;
            height: auto;
            image-rendering: pixelated;
        }

        .sans-text {
            margin-top: 25px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.9rem;
            color: #ffffff;
            text-align: center;
            letter-spacing: 1px;
            animation: floatText 2s ease-in-out infinite;
        }

        @keyframes floatText {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
    </style>
</head>
<body>

<!-- Pantalla de Sans (Sombra Secreta) -->
<div id="sansContainer">
    <img src="sans.png" alt="sans">
    <div class="sans-text">¿Que estás buscando?</div>
</div>

<!-- Contenedor Principal del Juego -->
<div class="container" id="mainContainer">
    <h1>[ PROYECTO: CÁLICO_AZUL ]</h1>

    <!-- Formulario de Códigos / Preguntas -->
    <form id="codeForm">
        <p id="promptText"># Ingresa el código</p>
        <input type="text" id="userInput" placeholder="Escribe tu respuesta..." autocomplete="off">
        <br>
        <button type="submit">INGRESAR</button>
    </form>

    <!-- Contenedor del Mensaje Final para Discord -->
    <div id="finalMessage" class="discord-instruction" style="display: none;">
        Envíame una foto del primer dibujo que te di por Discord.
    </div>

    <div id="responseMsg" class="response-msg"></div>

    <!-- Pista casi invisible -->
    <div class="secret-hint">¿has pensado en recargar la pagina?</div>
</div>

<script>
    // Contador de recargas (Easter Egg de Sans a las 5 recargas)
    let reloadCount = parseInt(localStorage.getItem('arg_reload_count') || '0', 10);
    reloadCount += 1;

    if (reloadCount === 5) {
        document.getElementById('mainContainer').style.display = 'none';
        document.getElementById('sansContainer').style.display = 'flex';
        localStorage.setItem('arg_reload_count', reloadCount);
    } else if (reloadCount >= 6) {
        localStorage.setItem('arg_reload_count', '0');
    } else {
        localStorage.setItem('arg_reload_count', reloadCount);
    }

    // Elementos DOM
    const codeForm = document.getElementById('codeForm');
    const input = document.getElementById('userInput');
    const msg = document.getElementById('responseMsg');
    const promptText = document.getElementById('promptText');
    const finalMessage = document.getElementById('finalMessage');

    // Estado del juego (1: "alfa", 2: "porcelana")
    let stage = 1;

    // Lógica de Validación de Respuestas
    codeForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const value = input.value.trim().toLowerCase();

        if (stage === 1) {
            if (value === 'alfa') {
                stage = 2;
                promptText.textContent = '¿Quién era nuestro dolor de cabeza?';
                input.value = '';
                msg.textContent = '';
            } else if (value === 'porcelana') {
                // Atajo directo si ingresa "porcelana" de primera
                mostrarInstruccionDiscord();
            } else {
                msg.className = 'response-msg error';
                msg.textContent = 'Codigo equivocado, Alfa ;p';
            }
        } else if (stage === 2) {
            if (value === 'porcelana') {
                mostrarInstruccionDiscord();
            } else {
                msg.className = 'response-msg error';
                msg.textContent = 'Codigo equivocado, Alfa ;p';
            }
        }
    });

    function mostrarInstruccionDiscord() {
        codeForm.style.display = 'none';
        msg.textContent = '';
        finalMessage.style.display = 'block';
    }
</script>

</body>
</html>
