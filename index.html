<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja con Imagen Superior</title>
    <style>
        /* Estilos generales de la página */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* 1. La caja que contiene tanto la imagen como el texto */
        .caja-contenedor {
            background-color: #2a2a2a;
            border: 2px solid #444;
            border-radius: 12px;
            width: 320px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            
            /* Usamos Flexbox para ordenar los elementos verticalmente dentro de la caja */
            display: flex;
            flex-direction: column;
            align-items: center; /* Centra los elementos horizontalmente dentro de la caja */
            text-align: center;
        }

        /* 2. Estilos para la imagen situada en la parte superior */
        .caja-contenedor img {
            width: 100%;       /* O el tamaño fijo que prefieras, ej: 80px */
            max-height: 160px; /* Limita la altura para que no deforme la caja */
            object-fit: cover; /* Mantiene la proporción de la imagen */
            border-radius: 8px;
            margin-bottom: 15px; /* Separa la imagen del texto inferior */
        }

        /* 3. Estilos para el bloque de texto */
        .caja-contenedor .texto-contenido h2 {
            margin: 0 0 10px 0;
            font-size: 1.4rem;
            color: #ff758c;
        }

        .caja-contenedor .texto-contenido p {
            margin: 0;
            font-size: 0.95rem;
            color: #ccc;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- Contenedor principal (La Caja) -->
    <div class="caja-contenedor">
        
        <!-- Imagen ubicada estrictamente en la parte superior dentro de la caja -->
        <img src="tu-imagen.jpg" alt="Imagen superior de la caja">

        <!-- Bloque de texto -->
        <div class="texto-contenido">
            <h2>Título Principal</h2>
            <p>Aquí va todo el texto descriptivo o mensaje que acompaña a la imagen dentro del contenedor principal.</p>
        </div>

    </div>

</body>
</html>
