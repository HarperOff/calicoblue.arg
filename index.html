<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/// ARCHIVO_DESCONOCIDO ///</title>
    <!-- Fuente Pixelada de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* Desactivar resaltado azul y selección de texto global */
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        /* Estilos Góticos con detalles Azul Neón */
        body {
            background-color: #050508;
            color: #d1e8ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        .container {
            position: relative;
            text-align: center;
            background: #0a0d14;
            padding: 40px;
            border: 1px solid #1e3a8a;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(30, 144, 255, 0.25), inset 0 0 15px rgba(0, 102, 255, 0.1);
            max-width: 450px;
            width: 90%;
            z-index: 2; /* Por encima de los corazones */
        }

        /* Botón de Recargar Página como Ícono en la esquina */
        .reload-icon-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: 1px solid #1e3a8a;
            color: #93c5fd;
            font-size: 1.1rem;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            outline: none;
            box-shadow: 0 0 8px rgba(30, 144, 255, 0.2);
            transition: all 0.3s ease;
        }

        .reload-icon-btn:hover {
            background-color: #1e293b;
            border-color: #3b82f6;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.6);
            transform: rotate(180deg);
        }

        h1 {
            color: #3b82f6;
            font-size: 1.4rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
            margin-bottom: 25px;
        }

        /* Palabra AZUL destacada en el título */
        .highlight-blue {
            color: #60a5fa;
            font-weight: bold;
            text-shadow: 0 0 12px #3b82f6, 0 0 22px #60a5fa, 0 0 35px #2563eb;
            animation: pulseGlow 2s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                text-shadow: 0 0 10px #3b82f6, 0 0 20px #60a5fa;
                color: #60a5fa;
            }
            100% {
                text-shadow: 0 0 18px #60a5fa, 0 0 30px #93c5fd, 0 0 45px #2563eb;
                color: #93c5fd;
            }
        }

        p {
            font-size: 1.1rem;
            color: #93c5fd;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* Estilo para la imagen de Roberto */
        .clue-image {
            max-width: 100%;
            height: auto;
            max-height: 200px;
            border: 1px solid #2563eb;
            border-radius: 6px;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
        }

        /* Animación de destello para los textos al cambiar */
        .flash-effect {
            animation: textFlash 0.8s ease-out;
        }

        @keyframes textFlash {
            0% {
                color: #ffffff;
                text-shadow: 0 0 20px #ffffff, 0 0 30px #60a5fa;
                transform: scale(1.03);
            }
            50% {
                color: #93c5fd;
                text-shadow: 0 0 15px #3b82f6;
            }
            100% {
                color: #93c5fd;
                text-shadow: none;
                transform: scale(1);
            }
        }

        input[type="text"] {
            background-color: #030712;
            border: 1px solid #2563eb;
            color: #60a5fa;
            padding: 12px 15px;
            font-family: inherit;
            font-size: 1rem;
            text-align: center;
            width: 80%;
            border-radius: 4px;
            outline: none;
            box-shadow: inset 0 0 5px rgba(37, 99, 235, 0.5);
            transition: all 0.3s ease;
            user-select: text;
            -webkit-user-select: text;
        }

        input[type="text"]:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 12px rgba(96, 165, 250, 0.8);
        }

        button {
            margin-top: 15px;
            background-color: #1e40af;
            color: #ffffff;
            border: none;
            padding: 10px 25px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(30, 64, 175, 0.5);
            transition: background-color 0.3s, transform 0.1s;
            outline: none;
        }

        button:hover {
            background-color: #2563eb;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.8);
        }

        .response-msg {
            margin-top: 20px;
            font-size: 0.95rem;
            min-height: 24px;
        }

        .error { color: #f87171; }
        .success { color: #60a5fa; }

        /* Mensaje final y Contador */
        .discord-instruction {
            color: #60a5fa;
            font-size: 1.1rem;
            line-height: 1.6;
            text-shadow: 0 0 8px rgba(96, 165, 250, 0.5);
        }

        #timer {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.5rem;
            color: #f87171;
            margin-top: 20px;
            text-shadow: 0 0 10px rgba(248, 113, 113, 0.7);
        }

        /* Pista secreta/oculta */
        .secret-hint {
            position: absolute;
            bottom: 8px;
            right: 12px;
            font-size: 0.65rem;
            color: rgba(147, 197, 253, 0.08);
            pointer-events: none;
        }

        /* Estilo para la pantalla secreta de Sans */
        #sansContainer {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            z-index: 3;
            position: relative;
        }

        #sansContainer img {
            max-width: 220px;
            height: auto;
            image-rendering: pixelated;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        #sansContainer img:active {
            transform: scale(0.95);
        }

        .sans-text {
            margin-top: 25px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.9rem;
            color: #ffffff;
            text-align: center;
            letter-spacing: 1px;
            animation: floatText 2s ease-in-out infinite;
        }

        /* Burbuja de Texto de Undertale para Sans */
        .speech-bubble {
            display: none;
            position: absolute;
            top: 20%;
            background: #ffffff;
            color: #000000;
            border: 4px solid #000000;
            padding: 15px 20px;
            border-radius: 8px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.75rem;
            max-width: 280px;
            line-height: 1.6;
            text-align: left;
            box-shadow: 0 0 0 4px #ffffff, 0 0 15px rgba(255, 255, 255, 0.5);
            z-index: 10;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px;
            border-style: solid;
            border-color: #000000 transparent transparent transparent;
        }

        @keyframes floatText {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* Corazones flotantes de fondo */
        #heartsContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .blue-heart {
            position: absolute;
            bottom: -50px;
            color: #3b82f6;
            font-size: 1.5rem;
            text-shadow: 0 0 10px #2563eb, 0 0 20px #60a5fa;
            opacity: 0.8;
            animation: floatUp 6s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* Efecto Krisselle (Lluvia Infinita de Noelle) */
        #noelleContainer {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            color: #a7f3d0;
            text-shadow: 0 0 8px #34d399, 0 0 15px #059669;
            opacity: 0.85;
        }

        .noelle-column {
            position: absolute;
            top: 0;
            display: flex;
            flex-direction: column;
            white-space: nowrap;
            line-height: 2.2;
            animation: scrollUpNoelle 1.2s linear infinite;
        }

        @keyframes scrollUpNoelle {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-50%);
            }
        }
    </style>
</head>
<body>

<!-- Contenedor para los corazones flotantes -->
<div id="heartsContainer"></div>

<!-- Contenedor para el efecto Krisselle / Noelle -->
<div id="noelleContainer"></div>

<!-- Pantalla de Sans (Sombra Secreta) -->
<div id="sansContainer">
    <div id="sansBubble" class="speech-bubble">¿Cuál es tu versión favorita de mi?</div>
    <img id="sansSprite" src="sans.png" alt="sans">
    <div class="sans-text">¿Que estás buscando?</div>
</div>

<!-- Contenedor Principal del Juego -->
<div class="container" id="mainContainer">
    <!-- Botón de recarga simplificado -->
    <button type="button" class="reload-icon-btn" onclick="location.reload();" title="Recargar página">🔄</button>

    <h1>[ PROYECTO: CÁLICO_<span class="highlight-blue">AZUL</span> ]</h1>

    <!-- Formulario de Códigos / Preguntas -->
    <form id="codeForm">
        <img id="robertoImg" src="roberto.png" alt="Pista Roberto" class="clue-image" style="display: none;">
        <p id="promptText"># Ingresa el código</p>
        <input type="text" id="userInput" placeholder="Escribe tu respuesta..." autocomplete="off">
        <br>
        <button type="submit">INGRESAR</button>
    </form>

    <!-- Contenedor del Mensaje Final con Contador -->
    <div id="finalMessage" class="discord-instruction" style="display: none;">
        <p>Envíame una foto del primer dibujo que te di por Discord.</p>
        <div id="timer">24:00:00</div>
    </div>

    <div id="responseMsg" class="response-msg"></div>

    <!-- Pista casi invisible -->
    <div class="secret-hint">¿has pensado en recargar la pagina?</div>
</div>

<script>
    // Contador de recargas (Easter Egg de Sans a las 5 recargas)
    let reloadCount = parseInt(localStorage.getItem('arg_reload_count') || '0', 10);
    reloadCount += 1;

    if (reloadCount === 5) {
        document.getElementById('mainContainer').style.display = 'none';
        document.getElementById('sansContainer').style.display = 'flex';
        localStorage.setItem('arg_reload_count', reloadCount);
    } else if (reloadCount >= 6) {
        localStorage.setItem('arg_reload_count', '0');
    } else {
        localStorage.setItem('arg_reload_count', reloadCount);
    }

    // Interacción al hacer clic/tocar a Sans
    const sansSprite = document.getElementById('sansSprite');
    const sansBubble = document.getElementById('sansBubble');

    if (sansSprite) {
        sansSprite.addEventListener('click', function() {
            sansBubble.style.display = 'block';
        });
    }

    // Elementos DOM
    const codeForm = document.getElementById('codeForm');
    const input = document.getElementById('userInput');
    const msg = document.getElementById('responseMsg');
    const promptText = document.getElementById('promptText');
    const robertoImg = document.getElementById('robertoImg');
    const finalMessage = document.getElementById('finalMessage');
    const timerDisplay = document.getElementById('timer');

    // Variables de intervalos de efectos de fondo
    let heartsInterval = null;

    // Estado del juego (1: "alfa", 2: "porcelana", 3: "roberto", 4: "kiki")
    let stage = 1;

    // Función auxiliar para aplicar la animación de destello
    function triggerFlash(element) {
        element.classList.remove('flash-effect');
        void element.offsetWidth; // Forzar reflow
        element.classList.add('flash-effect');
    }

    // Lógica de Validación de Respuestas
    codeForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const value = input.value.trim().toLowerCase();

        // Activación del código "azul"
        if (value === 'azul') {
            desactivarEfectoNoelle();
            activarCorazonesAzules();
            msg.className = 'response-msg success';
            msg.textContent = '💙';
            input.value = '';
            return;
        }

        // Activación del código "krisselle"
        if (value === 'krisselle') {
            desactivarCorazonesAzules();
            activarEfectoNoelle();
            msg.className = 'response-msg success';
            msg.textContent = '❄️';
            input.value = '';
            return;
        }

        if (stage === 1) {
            if (value === 'alfa') {
                stage = 2;
                promptText.textContent = '¿Quién era nuestro dolor de cabeza?';
                triggerFlash(promptText);
                input.value = '';
                msg.textContent = '';
            } else if (value === 'porcelana') {
                irAFaseRoberto();
            } else if (value === 'roberto') {
                irAFaseRoberto();
            } else if (value === 'kiki') {
                mostrarInstruccionDiscord();
            } else {
                mostrarError();
            }
        } else if (stage === 2) {
            if (value === 'porcelana') {
                irAFaseRoberto();
            } else if (value === 'roberto') {
                irAFaseRoberto();
            } else if (value === 'kiki') {
                mostrarInstruccionDiscord();
            } else {
                mostrarError();
            }
        } else if (stage === 3) {
            if (value === 'kiki') {
                mostrarInstruccionDiscord();
            } else {
                mostrarError();
            }
        }
    });

    function irAFaseRoberto() {
        stage = 3;
        robertoImg.style.display = 'inline-block';
        promptText.textContent = '¿Sabes quien es?';
        triggerFlash(promptText);
        triggerFlash(robertoImg);
        input.value = '';
        msg.textContent = '';
    }

    function mostrarError() {
        msg.className = 'response-msg error';
        msg.textContent = 'Codigo equivocado, Alfa ;p';
    }

    function mostrarInstruccionDiscord() {
        codeForm.style.display = 'none';
        msg.textContent = '';
        finalMessage.style.display = 'block';
        triggerFlash(finalMessage);
        start24HourTimer();
    }

    // Lógica de Corazones Azules Flotantes
    function activarCorazonesAzules() {
        if (heartsInterval !== null) return;

        const heartsContainer = document.getElementById('heartsContainer');

        heartsInterval = setInterval(() => {
            const heart = document.createElement('div');
            heart.classList.add('blue-heart');
            heart.innerHTML = '💙';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            heart.style.fontSize = (Math.random() * 1.2 + 0.8) + 'rem';
            
            heartsContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }, 400);
    }

    function desactivarCorazonesAzules() {
        if (heartsInterval !== null) {
            clearInterval(heartsInterval);
            heartsInterval = null;
        }
        document.getElementById('heartsContainer').innerHTML = '';
    }

    // Lógica del Efecto "Krisselle" (Lluvia infinita de Noelle subiendo rápido)
    function activarEfectoNoelle() {
        const noelleContainer = document.getElementById('noelleContainer');
        noelleContainer.innerHTML = '';
        noelleContainer.style.display = 'block';

        const columnCount = Math.floor(window.innerWidth / 90) + 2;

        for (let i = 0; i < columnCount; i++) {
            const col = document.createElement('div');
            col.classList.add('noelle-column');
            col.style.left = (i * 90) + 'px';
            col.style.animationDuration = (Math.random() * 0.5 + 0.8) + 's';

            // Generar repetición continua del nombre Noelle
            let textBlock = '';
            for (let j = 0; j < 35; j++) {
                textBlock += 'Noelle<br>';
            }
            col.innerHTML = textBlock + textBlock; // Duplicar bloque para scroll continuo sin saltos

            noelleContainer.appendChild(col);
        }
    }

    function desactivarEfectoNoelle() {
        const noelleContainer = document.getElementById('noelleContainer');
        noelleContainer.style.display = 'none';
        noelleContainer.innerHTML = '';
    }

    // Lógica del Temporizador en Tiempo Real (24 Horas)
    function start24HourTimer() {
        let startTime = localStorage.getItem('arg_timer_start');
        
        if (!startTime) {
            startTime = Date.now();
            localStorage.setItem('arg_timer_start', startTime);
        }

        const duration = 24 * 60 * 60 * 1000; // 24 horas en milisegundos

        function updateTimer() {
            const now = Date.now();
            const elapsed = now - parseInt(startTime, 10);
            const remaining = duration - elapsed;

            if (remaining <= 0) {
                timerDisplay.textContent = "00:00:00";
                clearInterval(interval);
                return;
            }

            const hours = Math.floor(remaining / (1000 * 60 * 60));
            const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

            const hStr = String(hours).padStart(2, '0');
            const mStr = String(minutes).padStart(2, '0');
            const sStr = String(seconds).padStart(2, '0');

            timerDisplay.textContent = `${hStr}:${mStr}:${sStr}`;
        }

        updateTimer();
        const interval = setInterval(updateTimer, 1000);
    }
</script>

</body>
</html>
